name: TEAMORA AI CI Preflight Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-and-build:
    name: Typecheck, Test Suite & Secret-Leak Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check (tsc --noEmit)
        run: npm run lint

      - name: Automated Vitest Security, AI & SaaS Suite
        run: npm test -- --run

      - name: Build Production Client Bundle
        run: npm run build

      - name: Scan Client Bundle for Secret Exposure
        run: |
          if grep -rnE "GEMINI_API_KEY|SAAS_WEBHOOK_SECRET|FIREBASE_SERVICE_ACCOUNT" dist/; then
            echo "ERROR: Potential server secret reference leaked in dist/"
            exit 1
          fi
          echo "PASS: Zero server secrets detected in client bundle."

# NOTE: Deployment to Cloud Run / Firebase Hosting is intentionally omitted from automatic pushes.
# Production or staging rollouts require explicit maintainer approval per Phase 354 governance.
